<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="CivCentral - Beacon icon">
  <title>CivCentral - Beacon icon</title>
  <defs>
    <linearGradient id="b-sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0B2E26"/><stop offset="1" stop-color="#04150F"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.55"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#4ADE80" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b-core" x1="0" y1="1" x2="0" y2="0">
